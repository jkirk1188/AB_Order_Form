<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; font-size: 13px; background: #fff; color: #000; }
  .selector-bar {
    background: #f0f0f0; border-bottom: 2px solid #999;
    padding: 10px 12px; position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 10px;
  }
  .selector-bar label { font-weight: bold; font-size: 12px; white-space: nowrap; }
  .selector-bar select {
    flex: 1; font-size: 15px; padding: 6px 8px;
    border: 1px solid #999; border-radius: 3px;
    background: #fff; font-family: Arial, sans-serif;
  }
  #form-area { display: none; }
  #form-area.visible { display: block; }
  .info-block { padding: 8px 10px 4px; font-size: 10px; border-bottom: 1px solid #ccc; }
  .info-block .address { margin-bottom: 2px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border: 1px solid #000; padding: 4px 5px; vertical-align: top; font-size: 9px; word-wrap: break-word; }
  th { font-weight: bold; font-size: 9px; background: #fff; }
  .col-code { width: 22%; } .col-desc { width: 38%; } .col-pack { width: 14%; }
  .col-amt { width: 12%; } .col-req { width: 14%; }
  .row-delivery td { background: #ffff00; font-weight: bold; font-size: 10px; }
  .row-total td { font-size: 9px; background: #fff; }
  .row-total .total-label { text-align: right; padding-right: 4px; }
  .row-total .total-val { font-weight: bold; }
  input[type="text"], input[type="date"], textarea {
    width: 100%; border: none; background: transparent;
    font-family: Arial, sans-serif; font-size: 9px;
    padding: 0; outline: none; -webkit-appearance: none; resize: none;
  }
  input[type="date"] { font-size: 11px; font-weight: bold; }
  .amt-input { text-align: center; font-size: 11px; font-weight: bold; width: 100%; }
  textarea { height: 28px; overflow: hidden; }
  .special-req-box { height: 40px; }
  .hint { text-align: center; font-size: 10px; color: #888; padding: 8px; }
</style>

  function buildRows(items, tbody) {
    tbody.innerHTML = '';
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var tr = document.createElement('tr');
      var noteHtml = item.note ? '<br><span style="font-size:8px;color:#555;">' + item.note + '</span>' : '';
      tr.innerHTML =
        '<td class="col-code">' + item.code + '</td>' +
        '<td class="col-desc">' + item.desc + noteHtml + '</td>' +
        '<td class="col-pack">' + (item.pack || '') + '</td>' +
        '<td class="col-amt"><input type="text" class="amt-input order-amt" inputmode="numeric" pattern="[0-9]*"></td>' +
        '<td class="col-req"><textarea></textarea></td>';
      tbody.appendChild(tr);
    }
  }

  function updateTotal() {
    var inputs = document.querySelectorAll('.order-amt');
    var total = 0;
    for (var i = 0; i < inputs.length; i++) {
      var v = parseInt(inputs[i].value, 10);
      if (!isNaN(v)) total += v;
    }
    document.getElementById('totalCases').textContent = total > 0 ? total : '';
  }

  function loadAccount() {
    var key = document.getElementById('accountSelect').value;
    if (!key) { document.getElementById('form-area').classList.remove('visible'); return; }
    var acct = accounts[key];
    document.getElementById('custNum').textContent  = acct.custNum;
    document.getElementById('custName').textContent = acct.custName;
    document.getElementById('deliveryDate').value   = '';
    document.getElementById('totalCases').textContent = '';
    buildRows(acct.regular, document.getElementById('regularItems'));
    buildRows(acct.special, document.getElementById('specialItems'));
    var inputs = document.querySelectorAll('.order-amt');
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].addEventListener('input', updateTotal);
    }
    document.getElementById('form-area').classList.add('visible');
    window.scrollTo(0, 0);
  }

  window.onload = function() {
    document.getElementById('accountSelect').addEventListener('change', loadAccount);
  };
