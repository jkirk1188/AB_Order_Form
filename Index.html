  .top-bar-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; margin-bottom: 6px; }
  .top-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .top-bar-row:last-child { margin-bottom: 0; }
  .top-bar-row label { font-weight: bold; font-size: 11px; color: #ccc; white-space: nowrap; width: 48px; flex-shrink: 0; }
  .top-bar-row select { flex: 1; font-size: 14px; padding: 5px 8px; border: 1px solid #555; border-radius: 3px; background: #2c2c2c; color: #fff; font-family: Arial, sans-serif; }
  #form-area { display: none; }
  #form-area.visible { display: block; }
  .info-block { padding: 8px 10px 4px; font-size: 10px; border-bottom: 1px solid #ccc; }
  .info-block .address { margin-bottom: 2px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border: 1px solid #000; padding: 4px 5px; vertical-align: top; font-size: 9px; word-wrap: break-word; }
  th { font-weight: bold; font-size: 9px; background: #fff; }
  .col-code { width: 20%; } .col-desc { width: 34%; } .col-pack { width: 13%; }
  .col-amt { width: 10%; } .col-unit { width: 9%; } .col-req { width: 14%; }
  .row-delivery td { background: #ffff00; font-weight: bold; font-size: 10px; }
  .row-total td { font-size: 9px; background: #fff; }
  .row-total .total-label { text-align: right; padding-right: 4px; }
  .row-total .total-val { font-weight: bold; }
  input[type="text"], input[type="date"], textarea { width: 100%; border: none; background: transparent; font-family: Arial, sans-serif; font-size: 9px; padding: 0; outline: none; -webkit-appearance: none; resize: none; }
  input[type="date"] { font-size: 11px; font-weight: bold; }
  .amt-input { text-align: center; font-size: 11px; font-weight: bold; width: 100%; }
  .unit-select { width: 100%; border: none; background: transparent; font-family: Arial, sans-serif; font-size: 9px; font-weight: bold; padding: 0; outline: none; -webkit-appearance: none; text-align: center; cursor: pointer; }
  textarea { height: 28px; overflow: hidden; }
  .special-req-box { height: 40px; }
  .export-bar { padding: 12px; background: #f0f0f0; border-top: 1px solid #ccc; text-align: center; }
  .export-btn { background: #1a5276; color: #fff; border: none; border-radius: 6px; padding: 12px 32px; font-size: 15px; font-weight: bold; font-family: Arial, sans-serif; cursor: pointer; width: 100%; }
  .export-btn:active { background: #154360; }
  @media print {
    .top-bar, .export-bar { display: none !important; }
    body { font-size: 10px; }
    #form-area { display: block !important; }
    input, textarea { border: none !important; background: transparent !important; }
    select { border: none !important; background: transparent !important; -webkit-appearance: none; }
    table { page-break-inside: auto; }
    tr { page-break-inside: avoid; }

  function populateAccounts(repKey) {
    var acctSelect = document.getElementById('accountSelect');
    acctSelect.innerHTML = '<option value="">— Select Account —</option>';
    if (!repKey) { acctSelect.disabled = true; return; }
    var rep = reps[repKey];
    var keys = Object.keys(rep.accounts);
    for (var i = 0; i < keys.length; i++) {
      var opt = document.createElement('option');
      opt.value = keys[i];
      opt.textContent = rep.accounts[keys[i]].name;
      acctSelect.appendChild(opt);
    }
    acctSelect.disabled = false;
  }

  function buildRows(items) {
    var tbody = document.getElementById('itemRows');
    tbody.innerHTML = '';
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var tr = document.createElement('tr');
      var noteHtml = item.note ? '<br><span style="font-size:8px;color:#555;">' + item.note + '</span>' : '';
      tr.innerHTML =
        '<td class="col-code">' + item.code + '</td>' +
        '<td class="col-desc">' + item.desc + noteHtml + '</td>' +
        '<td class="col-pack">' + (item.pack || '') + '</td>' +
        '<td class="col-amt"><input type="text" class="amt-input order-amt" inputmode="numeric" pattern="[0-9]*"></td>' +
        '<td class="col-unit"><select class="unit-select"><option>CS</option><option>EA</option><option>LB</option></select></td>' +
        '<td class="col-req"><textarea></textarea></td>';
      tbody.appendChild(tr);
    }
    var inputs = document.querySelectorAll('.order-amt');
    for (var j = 0; j < inputs.length; j++) {
      inputs[j].addEventListener('input', updateTotal);
    }
  }

  function updateTotal() {
    var inputs = document.querySelectorAll('.order-amt');
    var total = 0;
    for (var i = 0; i < inputs.length; i++) {
      if (inputs[i].value.trim() !== '') total++;
    }
    document.getElementById('totalLines').textContent = total > 0 ? total : '';
  }

  function loadAccount() {
    var repKey = document.getElementById('repSelect').value;
    var acctKey = document.getElementById('accountSelect').value;
    if (!repKey || !acctKey) { document.getElementById('form-area').classList.remove('visible'); return; }
    var acct = reps[repKey].accounts[acctKey];
    document.getElementById('custNum').textContent  = acctKey;
    document.getElementById('custName').textContent = acct.name;
    document.getElementById('deliveryDate').value   = '';
    document.getElementById('totalLines').textContent = '';
    buildRows(acct.items);
    document.getElementById('form-area').classList.add('visible');
    window.scrollTo(0, 0);
  }

  window.onload = function() {
    document.getElementById('repSelect').addEventListener('change', function() {
      populateAccounts(this.value);
      document.getElementById('form-area').classList.remove('visible');
    });
    document.getElementById('accountSelect').addEventListener('change', loadAccount);
  };
})();
